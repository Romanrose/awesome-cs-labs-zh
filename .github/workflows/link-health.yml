name: Check link health

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check official and source links
        run: ruby scripts/check_links.rb
